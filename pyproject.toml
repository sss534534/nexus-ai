[project]
name = "nexus-llm"
version = "2.1.0"
description = "Enterprise-grade 7B LLM Training Framework for Vertical Domains"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Nexus AI Team", email = "team@nexus-ai.com"}
]
keywords = ["llm", "transformer", "nlp", "deep-learning", "enterprise"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "tokenizers>=0.15.0",
    "accelerate>=0.25.0",
    "deepspeed>=0.12.0",
    "flash-attn>=2.5.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "cryptography>=41.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]
quantization = [
    "bitsandbytes>=0.42.0",
    "auto-gptq>=0.7.0",
    "optimum>=1.16.0",
]

[project.scripts]
nexus-train = "nexus_llm.cli:train_main"
nexus-serve = "nexus_llm.cli:serve_main"
nexus-eval = "nexus_llm.cli:eval_main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"