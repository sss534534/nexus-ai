# Enterprise Configuration
enterprise:
  # Monitoring
  monitoring:
    enabled: true
    prometheus_port: 9090
    metrics_interval: 60
    
    # Metrics to collect
    metrics:
      - "train_loss"
      - "train_steps"
      - "inference_latency"
      - "inference_tokens"
      - "gpu_memory"
      - "gpu_utilization"
      - "cpu_utilization"
      - "memory_usage"
    
    # Alerting
    alerting:
      enabled: true
      thresholds:
        gpu_memory: 0.9
        gpu_temperature: 80
        inference_latency: 5000  # ms
        error_rate: 0.01
      
      # Alert channels
      channels:
        - type: "email"
          recipients: ["admin@company.com"]
        - type: "slack"
          webhook: "https://hooks.slack.com/services/..."
        - type: "pagerduty"
          key: "..."
  
  # Security
  security:
    encryption_enabled: true
    audit_logging: true
    access_control: true
    api_key_required: true
    
    # Encryption
    encryption:
      algorithm: "AES-256-GCM"
      key_rotation_days: 90
      
      # Data encryption
      encrypt_checkpoints: true
      encrypt_logs: false
      encrypt_api_keys: true
    
    # Authentication
    authentication:
      type: "api_key"  # api_key, oauth, sso
      
      # API Key settings
      api_key:
        expiration_days: 365
        max_keys_per_user: 10
        require_rotation: true
      
      # OAuth settings
      oauth:
        enabled: false
        providers:
          - "google"
          - "github"
          - "azure"
      
      # SSO settings
      sso:
        enabled: false
        provider: "saml"
        metadata_url: "https://sso.company.com/metadata"
    
    # Authorization
    authorization:
      type: "rbac"  # rbac, abac
      
      # Roles
      roles:
        - name: "admin"
          permissions: ["*"]
        - name: "developer"
          permissions: ["train", "eval", "serve"]
        - name: "viewer"
          permissions: ["eval", "serve"]
    
    # Rate limiting
    rate_limiting:
      enabled: true
      
      # Global limits
      global:
        requests_per_minute: 1000
        tokens_per_minute: 100000
      
      # Per-user limits
      per_user:
        requests_per_minute: 100
        tokens_per_minute: 10000
        concurrent_requests: 10
      
      # Per-API-key limits
      per_api_key:
        requests_per_minute: 60
        tokens_per_minute: 6000
      
      # Burst handling
      burst:
        enabled: true
        multiplier: 2
    
    # IP restrictions
    ip_restrictions:
      enabled: false
      whitelist: []
      blacklist: []
      geo_blocking:
        enabled: false
        blocked_countries: []
    
    # Content filtering
    content_filtering:
      enabled: true
      
      # Input filtering
      input:
        max_length: 8192
        block_patterns: []
        profanity_filter: true
      
      # Output filtering
      output:
        toxicity_detection: true
        pii_detection: true
        sensitive_info_filter: true
  
  # Audit Logging
  audit:
    enabled: true
    log_path: "logs/audit.log"
    retention_days: 90
    
    # Events to log
    events:
      - "authentication"
      - "authorization"
      - "data_access"
      - "model_inference"
      - "model_training"
      - "system_changes"
    
    # Log format
    format: "json"
    
    # Log forwarding
    forwarding:
      enabled: false
      destination: "splunk"  # splunk, elk, datadog
      url: "https://splunk.company.com:8088"
      token: "..."
  
  # High Availability
  high_availability:
    enabled: true
    
    # Checkpoint replication
    checkpoint_replication:
      enabled: true
      replicas: 3
      strategy: "distributed"  # distributed, centralized
      
      # Storage backends
      storage_backends:
        - type: "local"
          path: "/data/checkpoints"
        - type: "s3"
          bucket: "nexus-checkpoints"
          region: "us-east-1"
        - type: "gcs"
          bucket: "nexus-checkpoints"
    
    # Auto recovery
    auto_recovery:
      enabled: true
      
      # Health checks
      health_checks:
        interval: 30
        timeout: 10
        retries: 3
      
      # Recovery actions
      recovery_actions:
        restart_on_failure: true
        failover_to_replica: true
        notify_on_recovery: true
    
    # Load balancing
    load_balancing:
      enabled: true
      strategy: "round_robin"  # round_robin, least_connections, weighted
      
      # Health check
      health_check:
        path: "/health"
        interval: 10
        timeout: 5
  
  # Resource Management
  resource_management:
    # GPU management
    gpu:
      memory_fraction: 0.9
      allow_growth: true
      multi_gpu_strategy: "mirrored"  # mirrored, parameter_server
      
      # GPU scheduling
      scheduling:
        enabled: true
        priority_classes:
          - name: "critical"
            weight: 10
          - name: "high"
            weight: 5
          - name: "normal"
            weight: 1
    
    # CPU management
    cpu:
      max_workers: 16
      thread_pool_size: 32
    
    # Memory management
    memory:
      limit: "256GB"
      swap_enabled: false
      
      # Memory optimization
      optimization:
        gradient_checkpointing: true
        activation_checkpointing: true
        cpu_offload: true
  
  # Compliance
  compliance:
    # GDPR
    gdpr:
      enabled: true
      data_retention_days: 365
      right_to_be_forgotten: true
      data_portability: true
    
    # SOC 2
    soc2:
      enabled: true
      audit_trail: true
      access_controls: true
      data_encryption: true
    
    # HIPAA (if applicable)
    hipaa:
      enabled: false
      phi_encryption: true
      access_logging: true
      audit_controls: true
    
    # Data residency
    data_residency:
      enabled: false
      regions: ["us-east-1", "eu-west-1"]
      data_classification: "confidential"
  
  # Disaster Recovery
  disaster_recovery:
    enabled: true
    
    # Backup
    backup:
      enabled: true
      schedule: "0 2 * * *"  # Daily at 2 AM
      retention: 30
      
      # Backup targets
      targets:
        - "checkpoints"
        - "configs"
        - "logs"
        - "data"
    
    # Recovery
    recovery:
      rpo: "1 hour"  # Recovery Point Objective
      rto: "4 hours"  # Recovery Time Objective
      
      # Recovery procedures
      procedures:
        automated: true
        manual_approval: false
        notification_channels: ["email", "slack"]
  
  # Cost Management
  cost_management:
    enabled: true
    
    # Budgeting
    budgeting:
      monthly_budget: 10000
      alert_thresholds: [50, 75, 90, 100]
    
    # Resource optimization
    optimization:
      auto_scaling: true
      spot_instances: true
      preemptible_instances: false
      
      # Scheduling
      scheduling:
        training_hours: "0-6"  # Train during off-peak hours
        inference_replicas: 2
  
  # Integration
  integration:
    # CI/CD
    cicd:
      enabled: true
      provider: "github_actions"  # github_actions, gitlab_ci, jenkins
      
      # Pipelines
      pipelines:
        - name: "train"
          trigger: "manual"
        - name: "eval"
          trigger: "on_commit"
        - name: "deploy"
          trigger: "on_tag"
    
    # MLOps
    mlops:
      enabled: true
      
      # Model registry
      model_registry:
        enabled: true
        provider: "mlflow"  # mlflow, wandb, neptune
        tracking_uri: "http://mlflow.company.com:5000"
      
      # Experiment tracking
      experiment_tracking:
        enabled: true
        provider: "wandb"
        project: "nexus-llm"
      
      # Feature store
      feature_store:
        enabled: false
        provider: "feast"
    
    # Monitoring
    monitoring_integration:
      enabled: true
      
      # APM
      apm:
        enabled: true
        provider: "datadog"  # datadog, newrelic, dynatrace
        api_key: "..."
      
      # Logging
      logging:
        enabled: true
        provider: "splunk"  # splunk, elk, cloudwatch
        
      # Alerting
      alerting:
        enabled: true
        provider: "pagerduty"  # pagerduty, opsgenie, victorops
