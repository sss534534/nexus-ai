# Nexus-7B Docker Compose Configuration
version: '3.8'

services:
  # ============================================================================
  # Model Serving Service
  # ============================================================================
  nexus-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: nexus-llm:latest
    container_name: nexus-server
    
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Environment variables
    environment:
      - MODEL_PATH=/app/model
      - TOKENIZER_PATH=/app/tokenizer
      - PORT=8000
      - WORKERS=1
      - PRECISION=bf16
      - LOG_LEVEL=INFO
    
    # Volumes
    volumes:
      - ./model:/app/model:ro
      - ./tokenizer:/app/tokenizer:ro
      - ./logs:/app/logs
    
    # Ports
    ports:
      - "8000:8000"
      - "9090:9090"  # Prometheus metrics
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================================
  # Load Balancer (for multiple instances)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - nexus-server
    
    restart: unless-stopped

  # ============================================================================
  # Prometheus Monitoring
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    restart: unless-stopped

  # ============================================================================
  # Grafana Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    depends_on:
      - prometheus
    
    restart: unless-stopped

  # ============================================================================
  # Redis Cache (for rate limiting and session management)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    command: redis-server --appendonly yes
    
    restart: unless-stopped

  # ============================================================================
  # Training Service (for distributed training)
  # ============================================================================
  nexus-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    image: nexus-llm:training
    container_name: nexus-trainer
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      - NCCL_DEBUG=INFO
      - NCCL_IB_DISABLE=0
    
    volumes:
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./checkpoints:/workspace/checkpoints
    
    # Only start when explicitly requested
    profiles:
      - training

# ============================================================================
# Volumes
# ============================================================================
volumes:
  prometheus_data:
  grafana_data:
  redis_data:

# ============================================================================
# Networks
# ============================================================================
networks:
  default:
    driver: bridge
